name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (fake PopNow server, no network)
        run: node --test test/*.test.mjs
      - name: Build the Chromium and Firefox packages
        run: node scripts/build.mjs
